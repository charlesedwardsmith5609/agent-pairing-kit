name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # shellcheck is preinstalled on ubuntu runners.
      - name: shellcheck
        run: |
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 shellcheck -x

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: secret scan behaviour (fake gitleaks)
        run: |
          bash tests/test-secret-scan.sh
          bash tests/test-staged-secret-scan.sh
      - name: misbehavior check heuristics
        run: bash tests/test-misbehavior-check.sh

  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [go, python, web, fullstack]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: matrix.profile == 'go' || matrix.profile == 'fullstack'
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        if: matrix.profile == 'web' || matrix.profile == 'fullstack'
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        if: matrix.profile == 'python'
        with:
          python-version: '3.12'
      - name: smoke run of new-project.sh
        run: bash tests/smoke-new-project.sh ${{ matrix.profile }}
